<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Laagan</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="navbar">
        <div class="logo">Laagan</div>
        <div class="nav-links"> <!--not working yet-->
            <a href="../index.html">Main</a>
            <a href="../pages/map.html">Map</a>
            <a href="contact.html">Contact</a>
            <a href="../pages/about.html">About Us</a>
        </div>
    </div>
    <div class="container"> <!--might turn the stars into js-->
        <!--problem: stars currently hardcoded (i want a spinny later on)-->
        <span class="star star1">★</span>
        <span class="star star2">★</span>
        <div class="content">
            <h1>Sign Up</h1>
            <div class="form-container">
                <p class="message" id="message"></p>
                <form onsubmit="checkSignUp(event)">
                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" minlength="8" required>
                    </div>
                     <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="Enter your password again" minlength="8" required>
                    </div>
                    <button type="submit" class="button-style">
                        Sign Up
                    </button>
                    <div class="auth-options">
                        <a href="login.html">Have an Account?</a>
                        <a href="../index.html">Back to Main</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="../js/auth.js" defer></script>
</body>
</html>
