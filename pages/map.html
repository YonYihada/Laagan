<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map | Laagan</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/map.js" defer></script>
</head>

<body class="map-page">
    <div class="navbar">
        <div class="logo">Laagan</div>
        <div class="nav-links"> <!--not working yet-->
            <a href="../index.html">Main</a>
            <a href="map.html" aria-current="page">Map</a>
            <a href="about.html">About Us</a>
            <a href="../pages/notfound.html">Contact</a>
        </div>
    </div>
    <main class="map-layout">
        <section class="map-stage" aria-label="Map of Cebu City">
            <div class="map-controls" aria-label="Map zoom controls">
                <button class="map-control" type="button" data-zoom="in" aria-label="Zoom in">+</button>
                <button class="map-control" type="button" data-zoom="out" aria-label="Zoom out">−</button>
                <button class="map-control" type="button" data-zoom="reset" aria-label="Reset map view">↺</button>
            </div>
            <div class="map-canvas">
                <div class="map-canvas__content">
                    <img class="map-stage__image" src="../assets/images/banilad.png" alt="Map of Cebu City">
                    <!-- Adjust --pin-x and --pin-y to position each pin on the map. -->
                    <button class="map-pin" type="button" data-location="location-1" style="--pin-x: 71%; --pin-y: 53%;" aria-label="Show Location 1" aria-pressed="false">
                        <img src="../assets/images/locations/speed.png" alt="">
                    </button>
                    <button class="map-pin" type="button" data-location="location-2" style="--pin-x: 48%; --pin-y: 51%;" aria-label="Show Location 2" aria-pressed="false">
                        <img src="../assets/images/locations/cmall.png" alt="">
                    </button>
                    <button class="map-pin" type="button" data-location="location-3" style="--pin-x: 37%; --pin-y: 81%;" aria-label="Show Location 3" aria-pressed="false">
                        <img src="../assets/images/locations/itpark.png" alt="">
                    </button>
                </div>
            </div>
        </section>
        <aside class="location-list" aria-labelledby="location-list-title">
            <h1 id="location-list-title">Possible Locations</h1>
            <p class="map-help">Drag to move the map. Scroll or pinch to zoom.</p>
            <button class="location-option" type="button" data-location="location-1" aria-pressed="false">Speed Pickleball Center</button>
            <button class="location-option" type="button" data-location="location-2" aria-pressed="false">Gaisano Country Mall</button>
            <button class="location-option" type="button" data-location="location-3" aria-pressed="false">Cebu IT Park</button>
        </aside>
    </main>
</body>

</html>
